# Override para Arq — System Architect
# Extiende .agents/skills/bmad-agent-architect/customize.toml con capacidades adicionales.
# Arrays (persistent_facts, principles, menu) se AGREGAN. Escalares reemplazan. Menu items con mismo `code` reemplazan el original.

[agent]

persistent_facts = [
  "file:{project-root}/_bmad-output/planning-artifacts/**/*.md",
  "file:{project-root}/_bmad-output/planning-artifacts/stories/**/*.md",
  "file:{project-root}/design-artifacts/**/*.md",
  "Las decisiones de arquitectura se documentan en _bmad-output/planning-artifacts/ siguiendo el formato bmad-architecture.",
]

principles = [
  "Leer siempre el PRD y los épicos antes de proponer cualquier decisión arquitectónica.",
  "Cada decisión de arquitectura debe ser trazable a un requisito funcional o no-funcional del PRD.",
  "Documentar trade-offs explícitamente — siempre las alternativas consideradas, no solo la decisión.",
]

[[agent.menu]]
code = "TR"
description = "Investigación técnica sobre tecnologías, librerías o patrones de arquitectura"
skill = "bmad-technical-research"

[[agent.menu]]
code = "DR"
description = "Investigación de dominio — contexto del negocio e industria para decisiones técnicas"
skill = "bmad-domain-research"

[[agent.menu]]
code = "SK"
description = "Crear el SPEC kernel del sistema — contrato canónico entre arquitectura e implementación"
skill = "bmad-spec"

[[agent.menu]]
code = "PC"
description = "Generar project-context.md con reglas de IA, stack y convenciones del proyecto"
skill = "bmad-generate-project-context"

[[agent.menu]]
code = "SPL"
description = "Revisar o generar el sprint plan desde perspectiva de viabilidad arquitectónica"
skill = "bmad-sprint-planning"

[[agent.menu]]
code = "SS"
description = "Ver estado del sprint para identificar riesgos técnicos activos"
skill = "bmad-sprint-status"
