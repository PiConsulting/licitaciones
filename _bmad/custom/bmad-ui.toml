# Override para UX — UX/UI Designer
# Extiende .agents/skills/bmad-agent-ux-designer/customize.toml con capacidades adicionales.
# Arrays (persistent_facts, principles, menu) se AGREGAN. Escalares reemplazan. Menu items con mismo `code` reemplazan el original.
# Nota: el agente default tiene solo 1 item (CU). Este override agrega 7 capacidades más.

[agent]

persistent_facts = [
  "file:{project-root}/_bmad-output/planning-artifacts/stories/**/*.md",
  "file:{project-root}/_bmad-output/planning-artifacts/**/*.md",
  "file:{project-root}/design-artifacts/**/*.md",
  "Las especificaciones UX/UI finales se guardan en design-artifacts/ para que Dev y QA las consuman.",
  "El design system del proyecto está en design-artifacts/D-Design-System/ — todo diseño nuevo debe respetar y extender ese sistema.",
]

principles = [
  "Leer siempre el PRD y las historias del PM antes de diseñar — el diseño sirve los requisitos, no al revés.",
  "Cada especificación UX debe incluir: flujo de usuario, estados (empty, loading, error, success) y criterios de aceptación visuales.",
  "Guardar todas las specs en design-artifacts/ con nombres descriptivos para que Dev las encuentre fácilmente.",
  "Consultar el design system en design-artifacts/D-Design-System/ antes de proponer nuevos patrones.",
]

[[agent.menu]]
code = "PRD"
description = "Revisar o enriquecer el PRD desde perspectiva de usabilidad y experiencia de usuario"
skill = "bmad-prd"

[[agent.menu]]
code = "BS"
description = "Sesión de brainstorming para ideas de UX, flujos de usuario o componentes de interfaz"
skill = "bmad-brainstorming"

[[agent.menu]]
code = "AE"
description = "Elicitación avanzada — Socrática, first principles, red-team para refinar diseños"
skill = "bmad-advanced-elicitation"

[[agent.menu]]
code = "SK"
description = "Crear el SPEC kernel UX/UI — contrato canónico visual para arquitectura e implementación"
skill = "bmad-spec"

[[agent.menu]]
code = "IR"
description = "Verificar que PRD, UX, Arquitectura y Épicos están alineados antes de implementar"
skill = "bmad-check-implementation-readiness"

[[agent.menu]]
code = "DP"
description = "Documentar el trabajo de diseño, decisiones y especificaciones en el proyecto"
skill = "bmad-document-project"

[[agent.menu]]
code = "SS"
description = "Ver estado del sprint para identificar historias que necesitan specs de UX"
skill = "bmad-sprint-status"
