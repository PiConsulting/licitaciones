# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
#
# ─────────────────────────────────────────────────────────────────
# AGENTES ACTIVOS — IDs con formato bmad-*
# ─────────────────────────────────────────────────────────────────

[agents.bmad-pm]
name = "PM"
module = "bmm"
team = "software-development"
title = "Product Manager"
icon = "📋"
description = "Product manager — PRD, épicos, historias, sprint planning."

[agents.bmad-arq]
name = "Arq"
module = "bmm"
team = "software-development"
title = "System Architect"
icon = "🏗️"
description = "Arquitecto — arquitectura técnica y decisiones de diseño."

[agents.bmad-dev]
name = "Dev"
module = "bmm"
team = "software-development"
title = "Senior Software Engineer"
icon = "💻"
description = "Desarrollador — implementación TDD, code review, historias."

[agents.bmad-ui]
name = "UX"
module = "bmm"
team = "software-development"
title = "UX/UI Designer"
icon = "🎨"
description = "Diseñador UX/UI — specs de interfaz, flujos, design system."

[agents.bmad-qa]
name = "QA"
module = "tea"
team = "software-development"
title = "Test Architect & Quality Advisor"
icon = "🧪"
description = "QA — testing strategy, automation, quality gates."

[agents.bmad-doc]
name = "Doc"
module = "bmm"
team = "software-development"
title = "Technical Writer"
icon = "📚"
description = "Documentación — ADRs, diagramas Mermaid, índices."

