# Override para bmad-dev-story — automatización Git: branch guard, commit y PR.
# activation_steps_prepend AGREGA al array base. on_complete reemplaza el escalar base.

[workflow]

activation_steps_prepend = [
  "Git branch guard — ejecutar inmediatamente, antes de cualquier paso del workflow: (1) Correr `git branch --show-current` y guardar el resultado como {{current_branch}}. (2) Si {{current_branch}} es 'main' o 'develop': una vez que {{story_key}} sea determinado en Step 1, y ANTES de escribir cualquier código en Step 5, ejecutar en secuencia: `git checkout develop` → `git pull origin develop` → `git checkout -b feat/{{story_key}}`. Si el checkout falla, HALT con mensaje 'No se pudo crear la rama feat/{{story_key}} — verificar conflictos'. (3) Si {{current_branch}} NO es 'main' ni 'develop': continuar sin crear rama, ya estás en una rama de trabajo válida. (4) Guardar {{working_branch}} = rama de trabajo final (nueva o existente) para usar al completar.",
]

on_complete = "Git commit, push y PR — ejecutar en este orden exacto después de actualizar el estado de la historia a 'review': (1) Correr `git status` para ver todos los archivos modificados. (2) Correr `git add -A` para stagear todos los cambios. (3) Determinar el tipo de commit (feat/fix/refactor/test/chore) según el propósito de la historia, y el scope (frontend/backend/auth/analysis/documents/storage/db/ci/agents) según los archivos modificados — si abarca múltiples scopes, elegir el más representativo. (4) Armar el mensaje de commit siguiendo Conventional Commits del project-context.md: formato exacto `<tipo>(<scope>): <descripcion imperativa en minúsculas, máx 72 chars>`, la descripción en imperativo (ej: 'agregar', 'implementar', 'corregir'). (5) Correr `git commit -m '<mensaje>'`. (6) Correr `git push -u origin {{working_branch}}`. (7) Crear el PR usando la herramienta GitHub MCP `mcp_github_mcp_se_create_pull_request` con: base='develop', head={{working_branch}}, title=mismo string del commit del paso 4, body=completar el template de .github/pull_request_template.md con contexto real de la historia implementada (qué hace, motivación, lista de cambios principales, tipo de cambio marcado con [x], cómo se probó incluyendo comandos de test). (8) Mostrar al usuario la URL del PR creado y el nombre de la rama."
